<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="css/style.css">
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
        }
    }
    </script>
    <script type="module">
        import { Viewer3D } from './js/viewer3d.js';
        const viewer = new Viewer3D('viewer-3d');
        window.updateOrientation = function(w, x, y, z) {
            viewer.setTargetOrientation(w, x, y, z);
        };
        window.updateHUD = function(data) {
            viewer.updateHUD(data);
        };
    </script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0a0a14; }
        #viewer-3d { width: 100%; height: 100%; position: relative; }
    </style>
</head>
<body>
    <div id="viewer-3d" class="viewer-3d"></div>
</body>
</html>
